name: Publish GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: sh -n scripts/install.sh && shellcheck scripts/install.sh
      - run: bun run verify
      - name: Pack release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run release:pack "$RELEASE_TAG"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tgz dist/effectory-v*.tar.gz dist/install.sh dist/SHA256SUMS \
            --verify-tag --title "Effectory $RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md --generate-notes --prerelease
