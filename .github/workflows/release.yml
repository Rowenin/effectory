# Builds and publishes a GitHub Release. Releases are normally cut from a
# maintainer machine with the same script:
#
#   bun scripts/release-assets.ts
#   gh release create v0.1.0 dist/release/* --title "Effectory v0.1.0" --generate-notes
#
# This workflow does the same in CI when started by hand (Actions → Release →
# Run workflow) for a tag that already exists. The release carries every
# binary, the SDK tarball that projects install by URL, the AWS vault
# extension, install.sh and SHA256SUMS. Nothing is published to npm.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Tag matches package versions
        env:
          TAG: ${{ inputs.tag }}
        run: |
          for manifest in package.json packages/*/package.json extensions/*/package.json; do
            version="$(jq -r .version "$manifest")"
            if [ "v$version" != "$TAG" ]; then
              echo "::error file=$manifest::version $version does not match tag $TAG"
              exit 1
            fi
          done
      - run: bun run typecheck
      - run: bun run check
      - run: bun test --timeout 60000

  release:
    needs: verify
    # Darwin binaries are built natively; Bun cross-compiles the Linux targets.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun scripts/release-assets.ts --outdir dist/release
      - name: Smoke test the native binary
        run: dist/release/effectory-darwin-arm64 version --json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" \
            --verify-tag \
            --title "Effectory $TAG" \
            --generate-notes \
            $prerelease \
            dist/release/*
