# Publishes a release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# 1. verify:  the tag matches every package version; typecheck, lint and tests pass.
# 2. binaries: compile every target, attach them, SHA256SUMS and install.sh to a
#    GitHub Release.
# 3. npm:     publish @offtree/effectory-sdk through npm trusted publishing (OIDC,
#    no token; provenance is generated automatically). Tags with a prerelease
#    suffix (v0.2.0-rc.1) publish under the `next` dist-tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for manifest in package.json packages/*/package.json extensions/*/package.json; do
            version="$(jq -r .version "$manifest")"
            if [ "$version" != "$tag" ]; then
              echo "::error file=$manifest::version $version does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - run: bun run typecheck
      - run: bun run check
      - run: bun test --timeout 60000

  binaries:
    needs: verify
    # Darwin binaries are built natively; Bun cross-compiles the Linux targets.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-binary.ts --target all --outdir dist/bin
      - run: bun run build:extension:aws-vault
      - name: Include extension checksum
        run: cat dist/extensions/aws-vault/SHA256SUMS >> dist/bin/SHA256SUMS
      - name: Smoke test the native binary
        run: dist/bin/effectory-darwin-arm64 version --json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Effectory ${GITHUB_REF_NAME}" \
            --generate-notes \
            $prerelease \
            dist/bin/effectory-* dist/bin/SHA256SUMS install.sh \
            dist/extensions/aws-vault/effectory-aws-vault.tgz

  npm:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-sdk.ts --outdir dist/sdk
      - name: Publish @offtree/effectory-sdk
        working-directory: dist/sdk
        run: |
          tag="latest"
          case "$GITHUB_REF_NAME" in *-*) tag="next" ;; esac
          npm publish --access public --tag "$tag"
